name: Notify IndexNow

on:
  push:
    branches:
      - main
    paths:
      - "**.html"
      - sitemap.xml
      - ab42b9d0bda743b8bfc7be14277b4986.txt
      - scripts/submit-indexnow.mjs
      - .github/workflows/indexnow.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indexnow-main
  cancel-in-progress: true

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Validate submission payload
        run: node scripts/submit-indexnow.mjs --dry-run
      - name: Notify IndexNow
        run: node scripts/submit-indexnow.mjs
